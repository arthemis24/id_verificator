[tool.poetry]
name = "id_verificator"
version = "0.1.0"
description = "Agent IA pour verification d'identité via API"
authors = ["Roddy MBOGNING <rmbogning@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.2"
djangorestframework = "^3.14"
djangorestframework-simplejwt = "^5.3"
pdf2image = "^1.17"
drf-spectacular = "^0.28"
psycopg2-binary = "^2.9"
celery = "^5.3"
redis = "^5.0"
Pillow = "^10.0"
deepface = "^0.0.90"
django-environ = "^0.10"
pytesseract = "^0.3.12"
gunicorn = "^20.2"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-django = "^4.5"
pytest-cov = "^7.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "id_verificator.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/*/migrations/*",
    "src/*/settings*.py",
    "src/manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
