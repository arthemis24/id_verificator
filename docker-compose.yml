version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: id_verificator_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-id_verificator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose:
      - "5432"          # internal only — not published to host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: id_verificator_redis
    expose:
      - "6379"          # internal only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: id_verificator_web
    command: >
      bash -c "python manage.py migrate --noinput &&
               python manage.py collectstatic --noinput &&
               gunicorn id_verificator.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 120"
    volumes:
      - media_data:/app/media   # named volume, not a bind-mount of the full repo
    environment:
      DJANGO_SETTINGS_MODULE: id_verificator.settings
      PYTHONPATH: /app/src
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${POSTGRES_DB:-id_verificator}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FACE_MODEL: ${FACE_MODEL:-ArcFace}
      FACE_THRESHOLD: ${FACE_THRESHOLD:-0.50}
      TF_USE_LEGACY_KERAS: "1"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: id_verificator_worker
    command: celery -A id_verificator worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: id_verificator.settings
      PYTHONPATH: /app/src
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "False"
      DB_NAME: ${POSTGRES_DB:-id_verificator}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FACE_MODEL: ${FACE_MODEL:-ArcFace}
      FACE_THRESHOLD: ${FACE_THRESHOLD:-0.50}
      TF_USE_LEGACY_KERAS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
